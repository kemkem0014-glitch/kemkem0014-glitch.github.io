<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ニュースレポート</title>
  <style>
    :root {
      color-scheme:light dark;
      --bg:#eef3f7; --paper:#fff; --text:#17212b; --muted:#63727e;
      --line:#cfdae1; --accent:#087cab; --accent2:#055f82; --soft:#e8f4f8;
      --note:#f5f8fa; --shadow:0 8px 24px rgba(25,47,66,.07); --error:#b42318;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;
      line-height:1.68;
    }
    .page { width:min(1180px,calc(100% - 28px)); margin:0 auto; padding:24px 0 64px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .btn {
      display:inline-flex; align-items:center; min-height:39px; padding:7px 12px;
      border:1px solid var(--line); border-radius:8px; background:var(--paper);
      color:var(--text); text-decoration:none; font-size:.84rem; font-weight:700;
    }
    .btn:hover { border-color:var(--accent); color:var(--accent); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn.primary:hover { background:var(--accent2); color:#fff; }
    .header,.analyst-panel {
      padding:clamp(22px,4vw,38px); border-radius:14px; background:var(--paper);
      box-shadow:var(--shadow); margin-bottom:22px;
    }
    .eyebrow { margin:0 0 6px; color:var(--accent); font-size:.75rem; font-weight:800; letter-spacing:.13em; }
    h1 { margin:0; font-size:clamp(1.8rem,4vw,2.7rem); line-height:1.2; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; }
    .pill { padding:5px 10px; border-radius:999px; background:var(--soft); color:var(--accent2); font-size:.8rem; font-weight:750; }
    .status { margin:12px 0 0; color:var(--muted); font-size:.86rem; }
    .status.error { color:var(--error); }
    .analyst-panel { padding:20px 22px; border:1px solid var(--line); }
    .analyst-panel h2 { margin:0 0 12px; font-size:1.18rem; }
    .analyst-card { padding:15px 16px; border-left:5px solid var(--accent); border-radius:9px; background:var(--note); }
    .analyst-card + .analyst-card { margin-top:11px; }
    .analyst-name { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; font-weight:800; }
    .analyst-comment { margin:0; }
    .forecast-box { margin-top:12px; padding:11px 13px; border-radius:8px; background:var(--soft); }
    .forecast-title { color:var(--accent2); font-size:.76rem; font-weight:800; letter-spacing:.04em; }
    .forecast-box p { margin:4px 0 0; }
    .forecast-meta { color:var(--muted); font-size:.82rem; }
    .integrated { margin-top:13px; padding-top:13px; border-top:1px solid var(--line); }
    .integrated-label { color:var(--muted); font-size:.76rem; font-weight:800; }
    .integrated p { margin:5px 0 0; }
    .section { margin-top:24px; }
    .section-title {
      margin:0 0 12px; padding:10px 14px; border-radius:7px;
      background:var(--accent); color:#fff; font-size:1.04rem;
    }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
    .card {
      min-width:0; padding:18px 19px; border:1px solid var(--line);
      border-left:5px solid var(--accent); border-radius:10px;
      background:var(--paper); box-shadow:var(--shadow);
    }
    .card-top { display:flex; align-items:center; gap:9px; margin-bottom:8px; }
    .num {
      min-width:31px; height:25px; display:inline-flex; align-items:center; justify-content:center;
      border-radius:6px; background:var(--soft); color:var(--accent2);
      font:.8rem ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:800;
    }
    .metadata { display:flex; flex-wrap:wrap; gap:5px 10px; min-width:0; }
    .meta-item { color:var(--muted); font-size:.75rem; font-weight:650; }
    .score { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    h3 { margin:0 0 9px; font-size:1.02rem; line-height:1.42; }
    .summary { margin:0; font-size:.91rem; text-align:justify; }
    .box { margin-top:13px; padding:11px 12px; border-radius:8px; background:var(--note); }
    .box-label { margin-bottom:4px; color:var(--accent2); font-size:.73rem; font-weight:800; letter-spacing:.04em; }
    .box p { margin:0; color:var(--muted); font-size:.84rem; }
    .box ul { margin:3px 0 0; padding-left:1.2rem; }
    .box li { margin:3px 0; color:var(--muted); font-size:.84rem; }
    .card-footer { margin-top:12px; padding-top:9px; border-top:1px solid var(--line); }
    .source-link { color:var(--accent); font-size:.82rem; font-weight:700; text-decoration:none; }
    .source-link:hover { text-decoration:underline; }
    .fallback {
      padding:18px; white-space:pre-wrap; overflow-wrap:anywhere;
      background:var(--paper); border-radius:10px; box-shadow:var(--shadow);
    }
    footer { margin-top:28px; color:var(--muted); font-size:.8rem; text-align:center; }
    @media(max-width:760px) {
      .grid { grid-template-columns:1fr; }
      .page { width:min(100% - 18px,1180px); padding-top:16px; }
    }
    @media(prefers-color-scheme:dark) {
      :root {
        --bg:#0d1420; --paper:#151f2e; --text:#edf3fb; --muted:#a5b3c7;
        --line:#2d3a4d; --accent:#3c91c7; --accent2:#90c9ed;
        --soft:#17344a; --note:#101a27; --shadow:none; --error:#ffb4ab;
      }
    }
  </style>
</head>
<body>
<main class="page">
  <nav class="toolbar">
    <a class="btn" href="index.html">一覧へ戻る</a>
    <a class="btn" href="downloads.html">ダウンロード一覧</a>
    <a id="pdfBtn" class="btn primary" href="#" target="_blank" rel="noopener noreferrer" hidden>PDFを開く</a>
    <a id="mdBtn" class="btn" href="#" hidden>Markdownを保存</a>
  </nav>

  <header class="header">
    <p class="eyebrow">PUBLIC NEWS REPORT</p>
    <h1 id="title">ニュースレポート</h1>
    <div class="meta">
      <span id="datePill" class="pill">対象日</span>
      <span id="countPill" class="pill">記事 0件</span>
    </div>
    <p id="status" class="status">レポートを読み込んでいます…</p>
  </header>

  <section id="analystPanel" class="analyst-panel" hidden></section>
  <div id="content"></div>
  <footer>各記事要約に加え、当日の担当分析官コメントと72時間見通しを表示しています。</footer>
</main>

<script>
"use strict";

const SUPABASE_PUBLIC_BASE = "https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const params = new URLSearchParams(location.search);
const reportType = params.get("type") || "";
const name = params.get("name") || reportType || "ニュース";
const dateValue = params.get("date") || "";
const markdownUrl = params.get("md") || "";
const pdfUrl = params.get("pdf") || "";

const titleEl = document.getElementById("title");
const datePill = document.getElementById("datePill");
const countPill = document.getElementById("countPill");
const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const pdfBtn = document.getElementById("pdfBtn");
const mdBtn = document.getElementById("mdBtn");
const analystPanel = document.getElementById("analystPanel");

function formatDate(value) {
  const s = String(value || "");
  if (!/^\d{8}$/.test(s)) return s || "不明";
  return `${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`;
}

function safeHttpUrl(value) {
  try {
    const u = new URL(String(value || ""));
    return ["http:","https:"].includes(u.protocol) ? u.href : "";
  } catch (_) {
    return "";
  }
}

function cleanInlineMarkdown(value) {
  return String(value || "")
    .replace(/\*\*(.+?)\*\*/g, "$1")
    .replace(/`(.+?)`/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
}

function el(tag, className="", text="") {
  const x = document.createElement(tag);
  if (className) x.className = className;
  if (text) x.textContent = text;
  return x;
}

function parseMarkdown(text) {
  text = String(text || "").replace(/^\uFEFF/, "");
  const lines = text.split(/\r?\n/);
  const articles = [];
  let section = "ニュース";
  let i = 0;

  while (i < lines.length) {
    const line = lines[i].trim();
    if (line.startsWith("## ") && !line.startsWith("### ")) {
      section = cleanInlineMarkdown(line.slice(3)) || "ニュース";
      i += 1;
      continue;
    }
    if (!line.startsWith("### ")) { i += 1; continue; }

    const title = cleanInlineMarkdown(line.slice(4));
    i += 1;
    const block = [];
    while (i < lines.length) {
      const x = lines[i].trim();
      if (x.startsWith("### ") || (x.startsWith("## ") && !x.startsWith("### "))) break;
      block.push(lines[i]);
      i += 1;
    }

    let score = "", source = "", url = "", mode = "summary";
    const summary = [], importance = [], points = [];
    for (const raw of block) {
      let s = raw.trim();
      if (!s || s === "---") continue;
      const meta = s.match(/^スコア[：:]\s*([0-9.]+)\s*[／/]\s*出典[：:]\s*(.+?)\s*$/);
      if (meta) { score = cleanInlineMarkdown(meta[1]); source = cleanInlineMarkdown(meta[2]); continue; }
      const link = s.match(/\[元記事\]\((https?:\/\/[^)]+)\)/);
      if (link) { url = link[1].trim(); continue; }
      if (s === "**重要性**" || s === "重要性") { mode = "importance"; continue; }
      if (s === "**重要ポイント**" || s === "重要ポイント") { mode = "points"; continue; }
      if (mode === "points") {
        s = cleanInlineMarkdown(s.replace(/^[-*]\s+/, ""));
        if (s) points.push(s);
      } else if (mode === "importance") {
        s = cleanInlineMarkdown(s); if (s) importance.push(s);
      } else {
        s = cleanInlineMarkdown(s); if (s) summary.push(s);
      }
    }
    if (title) {
      articles.push({section,title,score,source,url,
        summary:cleanInlineMarkdown(summary.join(" ")),
        importance:cleanInlineMarkdown(importance.join(" ")),points});
    }
  }
  return articles;
}

function renderArticles(articles) {
  contentEl.replaceChildren();
  if (!articles.length) return false;
  const sections = new Map();
  for (const a of articles) {
    if (!sections.has(a.section)) sections.set(a.section, []);
    sections.get(a.section).push(a);
  }
  let number = 0;
  for (const [sectionName, items] of sections) {
    const section = el("section","section");
    section.appendChild(el("h2","section-title",sectionName));
    const grid = el("div","grid");
    for (const a of items) {
      number += 1;
      const card = el("article","card");
      const top = el("div","card-top");
      top.appendChild(el("span","num",String(number).padStart(2,"0")));
      const metadata = el("div","metadata");
      if (a.source) metadata.appendChild(el("span","meta-item",a.source));
      if (a.score) metadata.appendChild(el("span","meta-item score",`SCORE ${a.score}`));
      top.appendChild(metadata);
      card.appendChild(top);
      card.appendChild(el("h3","",a.title));
      if (a.summary) card.appendChild(el("p","summary",a.summary));
      if (a.importance) {
        const box = el("div","box");
        box.appendChild(el("div","box-label","重要性"));
        box.appendChild(el("p","",a.importance));
        card.appendChild(box);
      }
      if (a.points.length) {
        const box = el("div","box");
        box.appendChild(el("div","box-label","重要ポイント"));
        const ul = document.createElement("ul");
        for (const p of a.points) ul.appendChild(el("li","",p));
        box.appendChild(ul);
        card.appendChild(box);
      }
      const sourceUrl = safeHttpUrl(a.url);
      if (sourceUrl) {
        const footer = el("div","card-footer");
        const link = el("a","source-link","元記事を開く ↗");
        link.href = sourceUrl; link.target = "_blank"; link.rel = "noopener noreferrer";
        footer.appendChild(link); card.appendChild(footer);
      }
      grid.appendChild(card);
    }
    section.appendChild(grid); contentEl.appendChild(section);
  }
  return true;
}

function renderAnalystAssessment(data) {
  if (!data || typeof data !== "object") return;
  const analysts = Array.isArray(data.analysts) ? data.analysts : [];
  analystPanel.replaceChildren();
  analystPanel.appendChild(el("h2","","担当分析官コメント・72時間見通し"));

  if (analysts.length) {
    for (const analyst of analysts) {
      const card = el("div","analyst-card");
      const nameRow = el("div","analyst-name");
      nameRow.appendChild(el("span","",analyst.agent_name || analyst.agent_id || "担当分析官"));
      if (analyst.analysis_role) nameRow.appendChild(el("span","pill",analyst.analysis_role));
      if (analyst.perspective) nameRow.appendChild(el("span","pill",analyst.perspective));
      card.appendChild(nameRow);
      if (analyst.comment) card.appendChild(el("p","analyst-comment",analyst.comment));
      const forecast = analyst.forecast_72h || {};
      if (forecast.development) {
        const box = el("div","forecast-box");
        box.appendChild(el("div","forecast-title","72時間見通し"));
        box.appendChild(el("p","",forecast.development));
        const metaParts = [];
        if (forecast.likelihood) metaParts.push(`可能性：${forecast.likelihood}`);
        if (forecast.rationale) metaParts.push(`根拠：${forecast.rationale}`);
        if (metaParts.length) box.appendChild(el("p","forecast-meta",metaParts.join(" ／ ")));
        card.appendChild(box);
      }
      analystPanel.appendChild(card);
    }
  } else {
    const card = el("div","analyst-card");
    card.appendChild(el("div","analyst-name","カテゴリ統合評価"));
    card.appendChild(el("p","analyst-comment",data.assessment || data.integrated_comment || "評価コメントはありません。"));
    const forecastText = data.forecast_72h || ((data.integrated_forecast_72h || {}).development || "");
    if (forecastText) {
      const box = el("div","forecast-box");
      box.appendChild(el("div","forecast-title","72時間見通し"));
      box.appendChild(el("p","",forecastText));
      card.appendChild(box);
    }
    analystPanel.appendChild(card);
  }

  if (data.integrated_comment && analysts.length) {
    const integrated = el("div","integrated");
    integrated.appendChild(el("div","integrated-label","統合評価"));
    integrated.appendChild(el("p","",data.integrated_comment));
    const forecast = data.integrated_forecast_72h || {};
    if (forecast.development) integrated.appendChild(el("p","forecast-meta",`統合72時間見通し：${forecast.development}`));
    analystPanel.appendChild(integrated);
  }
  analystPanel.hidden = false;
}

async function fetchJson(urlValue) {
  const u = new URL(urlValue);
  u.searchParams.set("_", String(Date.now()));
  const r = await fetch(u.href,{cache:"no-store",headers:{Accept:"application/json"}});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return await r.json();
}

async function load() {
  titleEl.textContent = `${name}ニュースレポート`;
  document.title = `${name}ニュースレポート`;
  datePill.textContent = `対象日 ${formatDate(dateValue)}`;

  const safePdf = safeHttpUrl(pdfUrl);
  if (safePdf) { pdfBtn.href = safePdf; pdfBtn.hidden = false; }
  const safeMd = safeHttpUrl(markdownUrl);
  if (safeMd) {
    mdBtn.href = safeMd + (safeMd.includes("?") ? "&download" : "?download");
    mdBtn.hidden = false;
  }

  const assessmentUrl = (/^\d{8}$/.test(dateValue) && /^[a-z0-9_-]+$/.test(reportType))
    ? `${SUPABASE_PUBLIC_BASE}/archive/${dateValue}/assessment/${reportType}.json`
    : "";

  const assessmentPromise = assessmentUrl
    ? fetchJson(assessmentUrl).then(renderAnalystAssessment).catch(err => console.warn("assessment:",err))
    : Promise.resolve();

  if (!safeMd) {
    statusEl.className = "status error";
    statusEl.textContent = "Markdown URLが指定されていません。";
    await assessmentPromise;
    return;
  }

  try {
    const u = new URL(safeMd);
    u.searchParams.set("_", String(Date.now()));
    const r = await fetch(u.href,{cache:"no-store",headers:{Accept:"text/markdown,text/plain;q=0.9,*/*;q=0.1"}});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const markdown = (await r.text()).replace(/^\uFEFF/, "");
    const articles = parseMarkdown(markdown);
    countPill.textContent = `記事 ${articles.length}件`;
    if (!renderArticles(articles)) {
      const pre = el("pre","fallback",markdown);
      contentEl.replaceChildren(pre);
      statusEl.textContent = "記事構造を検出できなかったためMarkdown本文を表示しています。";
    } else {
      statusEl.textContent = "記事要約と担当分析官の評価を表示しています。";
    }
  } catch (err) {
    console.error(err);
    statusEl.className = "status error";
    statusEl.textContent = "Markdownの取得または表示に失敗しました。";
    contentEl.replaceChildren(el("div","fallback","レポート本文を取得できませんでした。PDFから確認してください。"));
  }
  await assessmentPromise;
}

load();
</script>
</body>
</html>
