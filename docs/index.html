<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>最新ニュース・インテリジェンス評価</title>
  <style>
    :root{color-scheme:light dark;--bg:#eef3f7;--surface:#fff;--text:#17212b;--muted:#63727e;--line:#d3dde3;--accent:#087cab;--accent2:#055f82;--soft:#e8f4f8;--shadow:0 8px 24px rgba(25,47,66,.07);--error:#b42318}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.65}
    main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:44px 0 64px} header,.overall,.brief-panel{background:var(--surface);box-shadow:var(--shadow);border-radius:14px}
    header{padding:clamp(22px,4vw,38px);margin-bottom:22px}.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.13em}h1{margin:0;font-size:clamp(2rem,5vw,3.15rem);line-height:1.16}.updated,.status{color:var(--muted)}.updated{margin:12px 0 0}.status{margin:6px 0 0;font-size:.9rem}.status.error{color:var(--error)}
    .btn{display:inline-flex;align-items:center;min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);text-decoration:none;font-size:.84rem;font-weight:700}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2);color:#fff}
    .section-title{margin:30px 0 12px;padding:10px 14px;border-radius:7px;background:var(--accent);color:#fff;font-size:1.05rem}.overall{padding:22px 24px;border:1px solid var(--line);margin-bottom:20px}.overall-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.overall h2{margin:0;font-size:1.24rem}.level{display:inline-flex;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent2);font-size:.8rem;font-weight:800}.overall-comment{margin:0;font-size:1rem}.forecast{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--accent);border-radius:0 8px 8px 0;background:var(--soft)}.forecast-title{font-weight:800;color:var(--accent2);margin-bottom:5px}.forecast-list{margin:0;padding-left:1.25rem}.forecast-list li{margin:4px 0}.confidence{margin:9px 0 0;color:var(--muted);font-size:.83rem}
    .brief-panel{padding:18px;border:1px solid var(--line)}.brief-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.brief-actions{margin-bottom:12px}.brief-frame{width:100%;aspect-ratio:297/210;min-height:640px;border:1px solid var(--line);border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{min-width:0;padding:18px 19px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}.code{margin:0 0 3px;color:var(--muted);font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace}.card h2{margin:0 0 7px;font-size:1.1rem}.card-assessment{margin:0 0 12px;color:var(--muted);font-size:.84rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    details{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}summary{padding:13px 15px;cursor:pointer;font-weight:750}.history-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 12px 12px}.history-item{padding:11px 12px;border:1px solid var(--line);border-radius:8px}.history-name{font-weight:700;margin-bottom:6px}.empty{color:var(--muted)}footer{margin-top:28px;color:var(--muted);font-size:.8rem;text-align:center}
    @media(max-width:760px){.grid,.history-grid{grid-template-columns:1fr}main{width:min(100% - 18px,1180px);padding-top:18px}.brief-frame{min-height:420px}}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1420;--surface:#151f2e;--text:#edf3fb;--muted:#a5b3c7;--line:#2d3a4d;--accent:#3c91c7;--accent2:#90c9ed;--soft:#17344a;--shadow:none;--error:#ffb4ab}}
  </style>
</head>
<body><main>
  <header><div class="header-row"><div><p class="eyebrow">DAILY INTELLIGENCE REPORTS</p><h1>最新ニュース・インテリジェンス評価</h1><p id="updated" class="updated">最新情報を確認しています…</p><p id="status" class="status" aria-live="polite"></p></div><a class="btn primary" href="downloads.html">ダウンロードページ</a></div></header>
  <section id="overall" class="overall" hidden></section>
  <h2 class="section-title">本日の全体要約</h2><section class="brief-panel"><p id="briefStatus" class="empty" hidden></p><div id="briefActions" class="brief-actions"></div><iframe id="briefFrame" class="brief-frame" title="本日の全体要約" sandbox="allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" hidden></iframe></section>
  <h2 class="section-title">最新レポート</h2><section id="latest" class="grid"><p class="empty">読み込み中…</p></section>
  <h2 class="section-title">過去のレポート</h2><section id="history"><p class="empty">履歴を読み込み中…</p></section>
  <footer>表示はGitHub Pages、公開データ・HTML・PDFはSupabase Storageから取得しています。</footer>
</main>
<script>
"use strict";
const BASE="https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const URLS={manifest:`${BASE}/latest/index.json`,history:`${BASE}/latest/history.json`,assessment:`${BASE}/latest/assessment/index.json`,assets:`${BASE}/latest/v5-assets.json`};
const $=id=>document.getElementById(id), latestEl=$("latest"),historyEl=$("history"),updatedEl=$("updated"),statusEl=$("status"),overallEl=$("overall"),briefStatusEl=$("briefStatus"),briefActionsEl=$("briefActions"),briefFrameEl=$("briefFrame");
function formatDate(v){const s=String(v||"");return /^\d{8}$/.test(s)?`${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`:(s||"不明")}
function safeUrl(v){try{const u=new URL(String(v||""));return ["http:","https:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function button(label,href,primary=false,newTab=false){const a=document.createElement("a");a.className=`btn${primary?" primary":""}`;a.textContent=label;a.href=href;if(newTab){a.target="_blank";a.rel="noopener noreferrer"}return a}
function forecastItems(o){if(Array.isArray(o?.forecast_72h_items)&&o.forecast_72h_items.length)return o.forecast_72h_items.filter(Boolean).slice(0,5);const text=String(o?.forecast_72h||"").trim();if(!text)return[];const parts=text.split(/(?<=[。！？])\s*/).map(x=>x.trim()).filter(Boolean);return (parts.length?parts:[text]).slice(0,5)}
function reportPageUrl(r,date,latest=false){const p=new URLSearchParams();p.set("type",String(r.report_type||""));p.set("name",String(r.display_name||r.report_type||"レポート"));p.set("date",String(date||""));const md=safeUrl(latest?(r.latest_markdown_url||r.markdown_url):r.markdown_url),pdf=safeUrl(latest?(r.latest_pdf_url||r.pdf_url):r.pdf_url);if(md)p.set("md",md);if(pdf)p.set("pdf",pdf);return `report.html?${p.toString()}`}
function renderOverall(a){const o=a?.overall;if(!o)return;overallEl.hidden=false;overallEl.replaceChildren();const head=document.createElement("div");head.className="overall-head";const h=document.createElement("h2");h.textContent="Chief Fusion 日本への影響評価";const lv=document.createElement("span");lv.className="level";lv.textContent=`LEVEL ${o.assessment_level||1}/5`;head.append(h,lv);const c=document.createElement("p");c.className="overall-comment";c.textContent=o.assessment||"全体コメントはありません。";const f=document.createElement("div");f.className="forecast";const ft=document.createElement("div");ft.className="forecast-title";ft.textContent="日本への影響・今後72時間";f.appendChild(ft);const items=forecastItems(o);if(items.length){const ul=document.createElement("ul");ul.className="forecast-list";for(const x of items){const li=document.createElement("li");li.textContent=x;ul.appendChild(li)}f.appendChild(ul)}else{f.append("—")}const conf=document.createElement("p");conf.className="confidence";conf.textContent=`確度：${o.confidence||"—"}`;overallEl.append(head,c,f,conf)}
async function renderBrief(a){briefActionsEl.replaceChildren();briefStatusEl.hidden=true;briefStatusEl.textContent="";const b=a?.daily_brief||{},pdf=safeUrl(b.pdf),web=safeUrl(b.html);if(!web&&!pdf){briefStatusEl.hidden=false;briefStatusEl.textContent="本日の全体要約はまだ公開されていません。";briefFrameEl.hidden=true;return}if(web){const viewer=`daily-brief.html?src=${encodeURIComponent(web)}`;briefActionsEl.appendChild(button("全体要約を別画面で開く",viewer,true,true))}if(pdf)briefActionsEl.appendChild(button("PDFを開く・保存",pdf,false,true));if(web){try{const r=await fetch(web+(web.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const html=await r.text();briefFrameEl.removeAttribute("src");briefFrameEl.srcdoc=html;briefFrameEl.hidden=false;return}catch(e){console.error("daily brief html render failed",e)}}if(pdf){briefFrameEl.removeAttribute("srcdoc");briefFrameEl.src=pdf;briefFrameEl.hidden=false;return}briefStatusEl.hidden=false;briefStatusEl.textContent="本日の全体要約を表示できませんでした。";briefFrameEl.hidden=true}
function renderLatest(m,a){latestEl.replaceChildren();const reports=Array.isArray(m.reports)?m.reports:[],cats=a?.categories||{};updatedEl.textContent=`更新対象日: ${formatDate(m.report_date)}`;for(const r of reports){const rt=String(r.report_type||""),cat=cats[rt]||{},card=document.createElement("article");card.className="card";const code=document.createElement("p");code.className="code";code.textContent=rt||"report";const h=document.createElement("h2");h.textContent=String(r.display_name||rt||"レポート");const p=document.createElement("p");p.className="card-assessment";const analyst=Array.isArray(cat.analysts)?cat.analysts[0]:null;p.textContent=analyst?.comment?`直近3日：${analyst.comment}`:(cat.assessment?`Lv.${cat.assessment_level||"-"}/5　${cat.assessment}`:"カテゴリ評価はWeb版で確認できます。");const actions=document.createElement("div");actions.className="actions";actions.appendChild(button("ウェブで読む",reportPageUrl(r,m.report_date,true),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url),md=safeUrl(r.latest_markdown_url||r.markdown_url);if(pdf)actions.appendChild(button("PDF",pdf,false,true));if(md)actions.appendChild(button("Markdown",md+"?download"));card.append(code,h,p,actions);latestEl.appendChild(card)}if(!reports.length)latestEl.innerHTML='<p class="empty">公開済みの最新レポートがありません。</p>'}
function renderHistory(h,current){historyEl.replaceChildren();let count=0;for(const item of (Array.isArray(h.dates)?h.dates:[])){if(!item||String(item.report_date||"")===String(current||""))continue;const reports=Array.isArray(item.reports)?item.reports:[];if(!reports.length)continue;const d=document.createElement("details"),s=document.createElement("summary");s.textContent=formatDate(item.report_date);const grid=document.createElement("div");grid.className="history-grid";for(const r of reports){const box=document.createElement("div");box.className="history-item";const n=document.createElement("div");n.className="history-name";n.textContent=String(r.display_name||r.report_type||"レポート");const actions=document.createElement("div");actions.className="actions";actions.appendChild(button("ウェブで読む",reportPageUrl(r,item.report_date,false),true));const pdf=safeUrl(r.pdf_url),md=safeUrl(r.markdown_url);if(pdf)actions.appendChild(button("PDF",pdf,false,true));if(md)actions.appendChild(button("Markdown",md+"?download"));box.append(n,actions);grid.appendChild(box)}d.append(s,grid);historyEl.appendChild(d);count++}if(!count)historyEl.innerHTML='<p class="empty">過去のレポートはまだありません。</p>'}
async function fetchJson(url){const u=new URL(url);u.searchParams.set("_",String(Date.now()));const r=await fetch(u.href,{cache:"no-store",headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`HTTP ${r.status}: ${u.href}`);return r.json()}
async function load(){const [m,h,a,v]=await Promise.allSettled([fetchJson(URLS.manifest),fetchJson(URLS.history),fetchJson(URLS.assessment),fetchJson(URLS.assets)]);if(m.status==="fulfilled")renderLatest(m.value,a.status==="fulfilled"?a.value:{});else{latestEl.innerHTML='<p class="empty">最新レポートを取得できませんでした。</p>';updatedEl.textContent="更新対象日: 取得失敗"}if(a.status==="fulfilled")renderOverall(a.value);if(v.status==="fulfilled")await renderBrief(v.value);else{briefStatusEl.hidden=false;briefStatusEl.textContent="本日の全体要約を取得できませんでした。"}if(h.status==="fulfilled")renderHistory(h.value,m.status==="fulfilled"?m.value.report_date:"");else historyEl.innerHTML='<p class="empty">過去履歴を取得できませんでした。</p>';statusEl.className=m.status==="fulfilled"&&a.status==="fulfilled"?"status":"status error";statusEl.textContent=m.status==="fulfilled"&&a.status==="fulfilled"?"最新レポート、日本への影響評価、72時間見通しを表示しています。":"一部の公開データ取得に失敗しました。"}
load();
</script></body></html>
