<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Actor Event Timeline β | JCSA</title>
<style>
:root{--bg:#eef3f7;--paper:#fff;--ink:#122b49;--body:#334e68;--muted:#718096;--line:#d7e1ea;--navy:#071b2e;--blue:#1683c7;--cyan:#58c8ee;--soft:#eef8fd;--shadow:0 8px 28px rgba(18,43,73,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.6}
a{color:#116da8}main{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 54px}
.hero{background:linear-gradient(135deg,#06182a,#0a3451);color:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 14px 36px rgba(4,31,51,.2)}
.hero-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.eyebrow{margin:0 0 4px;color:#67d2fa;font-size:.72rem;font-weight:900;letter-spacing:.15em}.hero h1{margin:0;font-size:clamp(1.8rem,4vw,3rem);line-height:1.1}.hero p{margin:8px 0 0;color:#c7d9e7}.hero a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:7px 11px;border-radius:8px;font-size:.8rem;font-weight:800}
.controls{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.control-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr .85fr auto;gap:9px;align-items:end}
label{display:block;color:var(--muted);font-size:.73rem;font-weight:850;margin-bottom:4px}.input,.select{width:100%;min-height:42px;border:1px solid #bccbd8;border-radius:8px;background:#fff;color:var(--ink);padding:8px 10px;font:inherit}.btn{min-height:42px;border:1px solid #167db9;border-radius:8px;background:#167db9;color:#fff;padding:8px 14px;font:inherit;font-size:.84rem;font-weight:850;cursor:pointer}.btn.secondary{background:#fff;color:#28506e;border-color:#bccbd8}
.status{margin:10px 0 0;color:var(--muted);font-size:.78rem}.status.error{color:#a9362a}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}.kpi b{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.04em}.kpi strong{display:block;margin-top:2px;color:var(--ink);font-size:1.5rem}.kpi small{color:var(--muted);font-size:.7rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:14px}.panel-head h2{margin:0;color:var(--ink);font-size:1.22rem}.panel-head p{margin:0;color:var(--muted);font-size:.76rem}
.timeline{position:relative}.timeline:before{content:"";position:absolute;left:109px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--cyan),#bed2df)}
.row{display:grid;grid-template-columns:88px 42px minmax(0,1fr);gap:0;position:relative;margin:0 0 13px}.date{padding:13px 10px 0 0;text-align:right;color:#506980;font-size:.78rem;font-weight:850}.node{display:flex;justify-content:center;padding-top:17px}.dot{width:12px;height:12px;border-radius:50%;background:#1186c8;border:3px solid #e8f7fd;box-shadow:0 0 0 2px #1186c8;z-index:1}.event{border:1px solid #d5e0e8;border-left:4px solid #1d91cb;border-radius:11px;background:#fff;overflow:hidden}.event summary{list-style:none;cursor:pointer;padding:13px 15px}.event summary::-webkit-details-marker{display:none}.event-title{color:var(--ink);font-weight:850;line-height:1.45}.event-meta{display:flex;gap:7px 13px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:.72rem}.pill{display:inline-flex;padding:2px 7px;border-radius:999px;background:#edf6fb;color:#236483;font-weight:800}.details{padding:0 15px 14px;border-top:1px solid #e3ebf0;background:#fbfdfe}.article{padding:11px 0;border-bottom:1px solid #e8eef3}.article:last-child{border-bottom:0}.article-title{font-size:.86rem;color:#274760;font-weight:750}.article-meta{margin-top:3px;color:#8090a0;font-size:.7rem}.article a{text-decoration:none;font-weight:800}.empty{padding:24px;border:1px dashed #c2d0dc;border-radius:11px;color:var(--muted);text-align:center;background:#fafcfd}
.group-card{border:1px solid #d5e0e8;border-left:4px solid #1d91cb;border-radius:11px;background:#fff;padding:14px 15px}.group-card h3{margin:0;color:var(--ink);font-size:.98rem}.group-card p{margin:5px 0 0;color:#667b8f;font-size:.8rem}.group-list{margin:9px 0 0;padding-left:1.2rem;font-size:.8rem}.group-list li{margin:4px 0}
footer{margin-top:18px;color:var(--muted);font-size:.72rem;text-align:center}
@media(max-width:800px){.control-grid{grid-template-columns:1fr 1fr}.control-grid .wide{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr}.timeline:before{left:19px}.row{grid-template-columns:42px minmax(0,1fr)}.date{grid-column:2;text-align:left;padding:0 0 4px;font-size:.72rem}.node{grid-column:1;grid-row:1/3;padding-top:24px}.event,.group-card{grid-column:2}.panel{padding:13px}.panel-head{display:block}.panel-head p{margin-top:4px}}
</style>
</head>
<body>
<main>
<section class="hero">
  <div class="hero-top">
    <div><p class="eyebrow">JCSA / ACTOR EVENT TIMELINE β</p><h1>Actor 生起事象線表</h1><p>Supabase上の報道・分析データから、同一Actorに関する事象を時系列で統合表示します。</p></div>
    <a href="index.html">JCSAトップへ戻る</a>
  </div>
</section>

<section class="controls">
  <div class="control-grid">
    <div class="wide"><label for="actor">Actor</label><select id="actor" class="select"><option value="Handala">Handala</option></select></div>
    <div><label for="start">開始日</label><input id="start" class="input" type="date"></div>
    <div><label for="end">終了日</label><input id="end" class="input" type="date"></div>
    <div><label for="grain">まとめ方</label><select id="grain" class="select"><option value="event">統合事象</option><option value="day">日単位</option><option value="week">週単位</option><option value="month">月単位</option></select></div>
    <button id="apply" class="btn" type="button">表示</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap"><button id="all" class="btn secondary" type="button">全期間</button><span id="status" class="status">データを読み込んでいます…</span></div>
</section>

<section class="kpis">
  <div class="kpi"><b>対象ACTOR</b><strong id="kActor">Handala</strong><small id="aliases">—</small></div>
  <div class="kpi"><b>表示事象</b><strong id="kEvents">—</strong><small>期間フィルタ後</small></div>
  <div class="kpi"><b>関連記事</b><strong id="kArticles">—</strong><small>重複除去後</small></div>
  <div class="kpi"><b>データ期間</b><strong id="kPeriod" style="font-size:1rem">—</strong><small>未指定時は全期間</small></div>
</section>

<section class="panel">
  <div class="panel-head"><h2>Handala 生起事象線表</h2><p>統合事象を開くと、元記事と出典を確認できます。</p></div>
  <div id="timeline" class="timeline"><div class="empty">読み込み中…</div></div>
</section>
<footer>デモ版。公開ページはSupabaseの公開JSONだけを参照し、秘密鍵はブラウザへ配布しません。</footer>
</main>
<script>
"use strict";
const BASE="https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const DATA=BASE+"/timeline/handala/latest.json";
const $=id=>document.getElementById(id);
let payload=null;
function escText(v){return String(v??"").trim()}
function fmtDate(v){const s=String(v||"");return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.slice(0,4)+"/"+s.slice(5,7)+"/"+s.slice(8,10):s||"—"}
function safeUrl(v){try{const u=new URL(String(v||""));return ["http:","https:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function mondayOf(dateStr){const d=new Date(dateStr+"T00:00:00Z");const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return d.toISOString().slice(0,10)}
function groupKey(date,grain){if(grain==="day")return date;if(grain==="week")return mondayOf(date);if(grain==="month")return date.slice(0,7);return date}
function rangeLabel(key,grain){if(grain==="month")return key.replace("-","年")+"月";if(grain==="week"){const d=new Date(key+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+6);return fmtDate(key)+"–"+fmtDate(d.toISOString().slice(0,10))}return fmtDate(key)}
function makeArticle(a){const box=document.createElement("div");box.className="article";const t=document.createElement("div");t.className="article-title";t.textContent=escText(a.title_ja||a.title||"無題");const m=document.createElement("div");m.className="article-meta";m.textContent=[a.source,a.published_at||a.run_date,a.report_type,a.score?("score "+a.score):""].filter(Boolean).join(" · ");box.append(t,m);const u=safeUrl(a.url);if(u){const link=document.createElement("a");link.href=u;link.target="_blank";link.rel="noopener noreferrer";link.textContent="元記事を開く";box.appendChild(link)}return box}
function renderEvent(e){const row=document.createElement("div");row.className="row";const date=document.createElement("div");date.className="date";date.textContent=fmtDate(e.date);const node=document.createElement("div");node.className="node";const dot=document.createElement("span");dot.className="dot";node.appendChild(dot);const det=document.createElement("details");det.className="event";const sum=document.createElement("summary");const title=document.createElement("div");title.className="event-title";title.textContent=escText(e.summary);const meta=document.createElement("div");meta.className="event-meta";const p1=document.createElement("span");p1.className="pill";p1.textContent=String(e.article_count||0)+"件";const p2=document.createElement("span");p2.textContent=(e.sources||[]).slice(0,4).join(" / ")||"出典不明";meta.append(p1,p2);sum.append(title,meta);const body=document.createElement("div");body.className="details";for(const a of (e.articles||[]))body.appendChild(makeArticle(a));det.append(sum,body);row.append(date,node,det);return row}
function renderGrouped(events,grain){const groups=new Map();for(const e of events){const k=groupKey(e.date,grain);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}const root=$("timeline");root.replaceChildren();for(const pair of [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){const key=pair[0],items=pair[1];const row=document.createElement("div");row.className="row";const date=document.createElement("div");date.className="date";date.textContent=rangeLabel(key,grain);const node=document.createElement("div");node.className="node";const dot=document.createElement("span");dot.className="dot";node.appendChild(dot);const card=document.createElement("div");card.className="group-card";const h=document.createElement("h3");const articles=items.reduce((n,x)=>n+Number(x.article_count||0),0);h.textContent=items.length+"事象 / "+articles+"記事";const p=document.createElement("p");p.textContent=(items.flatMap(x=>x.sources||[]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,5)).join(" / ")||"出典不明";const ul=document.createElement("ul");ul.className="group-list";for(const e of items){const li=document.createElement("li");li.textContent=e.summary;ul.appendChild(li)}card.append(h,p,ul);row.append(date,node,card);root.appendChild(row)}}
function currentEvents(){if(!payload)return[];const start=$("start").value,end=$("end").value;return (payload.events||[]).filter(e=>(!start||e.date>=start)&&(!end||e.date<=end))}
function render(){const events=currentEvents();const root=$("timeline");if(!events.length){root.innerHTML='<div class="empty">指定期間にHandala関連事象はありません。</div>'}else if($("grain").value==="event"){root.replaceChildren(...events.map(renderEvent))}else renderGrouped(events,$("grain").value);const articles=events.reduce((n,x)=>n+Number(x.article_count||0),0);$("kEvents").textContent=String(events.length);$("kArticles").textContent=String(articles);$("kPeriod").textContent=events.length?fmtDate(events[0].date)+" – "+fmtDate(events[events.length-1].date):"—";$("status").textContent="表示中: "+events.length+"事象 / "+articles+"記事"}
async function load(){try{const u=new URL(DATA);u.searchParams.set("_",Date.now());const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);payload=await r.json();$("kActor").textContent=payload.actor||"Handala";$("aliases").textContent=(payload.aliases||[]).slice(0,4).join(" / ");render()}catch(e){console.error(e);$("status").className="status error";$("status").textContent="公開JSONをまだ取得できません。生成Workflowの完了後に自動表示されます。";$("timeline").innerHTML='<div class="empty">Handala線表データを準備中です。</div>'}}
$("apply").addEventListener("click",render);$("grain").addEventListener("change",render);$("all").addEventListener("click",()=>{$("start").value="";$("end").value="";render()});load();
</script>

<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"4002fd0c317c4358bb24d5d647032f7a"}'></script>

</body>
</html>
