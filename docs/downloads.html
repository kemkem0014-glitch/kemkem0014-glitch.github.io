<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>過去レポート・アーカイブ</title>
<style>
:root{--bg:#f3f6f9;--surface:#fff;--ink:#10284e;--body:#314763;--muted:#6c7b8d;--line:#d9e3ec;--blue:#2378b9;--soft:#eef7fc;--shadow:0 8px 24px rgba(26,52,78,.07);--error:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.6}
main{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 56px}
.hero{background:linear-gradient(135deg,#061529 0%,#082542 58%,#0b3856 100%);border-radius:20px;padding:24px;box-shadow:0 14px 40px rgba(3,28,48,.2);margin-bottom:22px;color:#fff}
.hero-row{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.eyebrow{margin:0 0 5px;color:#63d0ff;font-size:.76rem;font-weight:900;letter-spacing:.14em}h1{margin:0;font-size:clamp(2rem,4vw,3.15rem);line-height:1.05}.lead{margin:9px 0 0;color:#c9dbe8}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:#173657;text-decoration:none;font:inherit;font-size:.88rem;font-weight:800;cursor:pointer}.btn.primary{background:#1677b8;border-color:#1677b8;color:#fff}.hero .btn{border-color:rgba(179,220,240,.42);background:rgba(255,255,255,.09);color:#fff}
.selector{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:22px}.selector h2{margin:0 0 10px;color:var(--ink);font-size:1.12rem}.selector-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.selector label{font-weight:850;color:var(--ink)}.date-select{min-width:260px;min-height:46px;padding:10px 13px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:var(--ink);font:inherit}.status{margin:9px 0 0;color:var(--muted);font-size:.84rem}.status.error{color:var(--error)}
.group{margin-top:22px}.group-title{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:var(--ink);font-size:1.18rem}.group-title:before{content:"";width:5px;height:1.3em;border-radius:4px;background:#56b6db}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow);min-width:0}.code{margin:0;color:var(--muted);font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace}.card h3{margin:3px 0 7px;color:var(--ink);font-size:1.05rem}.desc{margin:0 0 12px;color:#526579;font-size:.86rem}.empty{padding:18px;border:1px dashed #c7d3df;border-radius:10px;background:#fff;color:var(--muted)}footer{margin-top:30px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:720px){main{width:min(100% - 18px,1120px);padding-top:14px}.hero{padding:16px;border-radius:14px}.grid{grid-template-columns:1fr}.date-select{width:100%;min-width:0}.selector-row{align-items:stretch}.btn{width:100%}}
</style>
</head>
<body><main>
<section class="hero">
  <div class="hero-row">
    <div>
      <p class="eyebrow">PAST REPORT ARCHIVE</p>
      <h1>過去レポート</h1>
      <p class="lead">過去の日付を選び、カテゴリごとのレポートを現在と同じWeb形式で閲覧できます。</p>
    </div>
    <div class="actions"><a class="btn" href="categories.html">カテゴリ別レポートへ戻る</a><a class="btn" href="index.html">日本向け評価へ戻る</a></div>
  </div>
</section>

<section class="selector" aria-label="過去レポートの日付選択">
  <h2>1. 日付を選択</h2>
  <div class="selector-row">
    <label for="historyDate">対象日</label>
    <input id="historyDate" class="date-select" type="date" aria-label="読みたい過去の日付">
  </div>
  <p id="historyStatus" class="status">カレンダーから読みたい過去の日付を選んでください。</p>
</section>

<div id="historyGroups"><p class="empty">日付を選ぶとカテゴリが表示されます。</p></div>
<footer>このページは過去レポートのWeb閲覧専用です。</footer>
</main>
<script>
"use strict";
const BASE="https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const HISTORY=`${BASE}/latest/history.json`,MANIFEST=`${BASE}/latest/index.json`;
const GROUPS=[{name:"各国",types:["cyber_iran","cyber_china","cyber_russia","cyber_north_korea"]},{name:"テック",types:["space","cyber_tech"]},{name:"軍事・防衛",types:["cyber_military"]}];
const historyDate=document.getElementById("historyDate"),historyStatus=document.getElementById("historyStatus"),historyGroups=document.getElementById("historyGroups");
let historyByDate=new Map(),currentDate="";
function safeUrl(v){try{const u=new URL(String(v||""));return ["http:","https:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function fmtDate(v){const s=String(v||"");return /^\d{8}$/.test(s)?`${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`:s||"不明"}
function reportDisplayName(r){const rt=String(r?.report_type||"");if(rt==="cyber_tech")return "サイバー・テック";return String(r?.display_name||rt||"レポート")}
function reportPageUrl(r,date){const p=new URLSearchParams();p.set("type",String(r?.report_type||""));p.set("name",reportDisplayName(r));p.set("date",String(date||""));const md=safeUrl(r?.markdown_url),pdf=safeUrl(r?.pdf_url);if(md)p.set("md",md);if(pdf)p.set("pdf",pdf);return `report.html?${p.toString()}`}
function makeWebBtn(r,date){const a=document.createElement("a");a.className="btn primary";a.textContent="ウェブで読む";a.href=reportPageUrl(r,date);return a}
async function getJson(url){const u=new URL(url);u.searchParams.set("_",Date.now());const r=await fetch(u,{cache:"no-store",headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
function populate(history){historyByDate.clear();for(const item of (history?.dates||[])){const date=String(item?.report_date||""),reports=Array.isArray(item?.reports)?item.reports:[];if(!/^\d{8}$/.test(date)||date===currentDate||!reports.length)continue;historyByDate.set(date,item)}historyStatus.textContent="カレンダーから読みたい過去の日付を選んでください。"}
function dateInputToKey(v){const s=String(v||"");return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.replaceAll("-",""):""}
function renderDate(){const date=dateInputToKey(historyDate.value);historyGroups.replaceChildren();if(!date){historyStatus.textContent="カレンダーから読みたい過去の日付を選んでください。";const p=document.createElement("p");p.className="empty";p.textContent="日付を選ぶと、その日のカテゴリが表示されます。";historyGroups.appendChild(p);return}if(date===currentDate){historyStatus.textContent="このページは過去レポート専用です。今日のレポートは最新カテゴリページから閲覧してください。";const p=document.createElement("p");p.className="empty";p.textContent="過去の日付を選択してください。";historyGroups.appendChild(p);return}const item=historyByDate.get(date);if(!item){historyStatus.textContent=`${fmtDate(date)}の公開レポートはありません。`;const p=document.createElement("p");p.className="empty";p.textContent="別の日付を選択してください。";historyGroups.appendChild(p);return}const reports=Array.isArray(item.reports)?item.reports:[];historyStatus.textContent=`${fmtDate(date)}：カテゴリを選んで「ウェブで読む」を押してください。`;const used=new Set();for(const g of GROUPS){const matches=reports.filter(r=>g.types.includes(String(r.report_type||"")));matches.forEach(r=>used.add(String(r.report_type||"")));if(!matches.length)continue;const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent=g.name;const grid=document.createElement("div");grid.className="grid";for(const r of matches){const card=document.createElement("article");card.className="card";const code=document.createElement("p");code.className="code";code.textContent=String(r.report_type||"");const title=document.createElement("h3");title.textContent=reportDisplayName(r);const desc=document.createElement("p");desc.className="desc";desc.textContent=`${fmtDate(date)}のレポート`;card.append(code,title,desc,makeWebBtn(r,date));grid.appendChild(card)}section.append(h,grid);historyGroups.appendChild(section)}const other=reports.filter(r=>!used.has(String(r.report_type||"")));if(other.length){const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent="その他";const grid=document.createElement("div");grid.className="grid";for(const r of other){const card=document.createElement("article");card.className="card";const title=document.createElement("h3");title.textContent=reportDisplayName(r);const desc=document.createElement("p");desc.className="desc";desc.textContent=`${fmtDate(date)}のレポート`;card.append(title,desc,makeWebBtn(r,date));grid.appendChild(card)}section.append(h,grid);historyGroups.appendChild(section)}}
historyDate.addEventListener("change",renderDate);
(async()=>{try{const [history,manifest]=await Promise.all([getJson(HISTORY),getJson(MANIFEST).catch(()=>({}))]);currentDate=String(manifest?.report_date||"");populate(history)}catch(e){console.error(e);historyStatus.className="status error";historyStatus.textContent="過去レポートの取得に失敗しました。";historyGroups.innerHTML='<p class="empty">時間を置いて再読み込みしてください。</p>'}})();
</script>

</body></html>
