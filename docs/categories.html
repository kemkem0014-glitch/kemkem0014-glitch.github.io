<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>カテゴリ別インテリジェンス・レポート</title>
<style>
:root{--bg:#f3f6f9;--surface:#fff;--ink:#10284e;--body:#314763;--muted:#6c7b8d;--line:#d9e3ec;--blue:#2378b9;--soft:#eef7fc;--shadow:0 8px 24px rgba(26,52,78,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.6}a{color:inherit}
main{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 56px}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 18% 35%,rgba(37,167,228,.22),transparent 32%),linear-gradient(135deg,#061529 0%,#082542 58%,#0b3856 100%);border:0;border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(3,28,48,.2);margin-bottom:22px;color:#fff}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(56,184,238,.06) 48%,transparent 100%);pointer-events:none}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.hero-brand{display:flex;align-items:center;gap:18px;min-width:0}.hero-logo{width:clamp(110px,12vw,180px);height:auto;flex:0 0 auto;object-fit:contain}.hero-copy{min-width:0}.eyebrow{margin:0 0 5px;color:#63d0ff;font-size:.76rem;font-weight:900;letter-spacing:.14em}h1{margin:0;color:#fff;font-size:clamp(2rem,4vw,3.25rem);line-height:1.04;letter-spacing:-.035em}.lead{margin:9px 0 0;color:#c9dbe8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:#173657;text-decoration:none;font:inherit;font-size:.88rem;font-weight:800;cursor:pointer}.btn.primary{background:#1677b8;border-color:#1677b8;color:#fff}.hero .btn{border-color:rgba(179,220,240,.42);background:rgba(255,255,255,.09);color:#fff}.hero .btn.primary{background:#1c8dcc;border-color:#1c8dcc;color:#fff}
.search-panel{margin-bottom:22px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}.search-title{margin:0 0 10px;color:var(--ink);font-size:1.08rem}.search-row{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:9px;align-items:center}.search-input,.search-select{width:100%;min-height:46px;padding:10px 13px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:.95rem;outline:none}.search-input:focus,.search-select:focus{border-color:#2378b9;box-shadow:0 0 0 3px rgba(35,120,185,.12)}.search-help{margin:9px 0 0;color:var(--muted);font-size:.82rem}.search-count{font-weight:850;color:var(--ink)}
.results-wrap{display:none;margin:0 0 30px}.results-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}.results-head h2{margin:0;color:var(--ink);font-size:1.18rem}.result-list{display:grid;grid-template-columns:1fr;gap:10px}.result-card{padding:16px 18px;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:11px;background:#fff;box-shadow:var(--shadow)}.result-meta{display:flex;gap:8px 12px;flex-wrap:wrap;margin-bottom:5px;color:var(--muted);font-size:.77rem;font-weight:750}.result-date{color:#0e668f}.result-card h3{margin:0 0 7px;color:var(--ink);font-size:1rem;line-height:1.45}.result-summary{margin:0 0 10px;color:#526579;font-size:.86rem}.result-actions{display:flex;gap:8px;flex-wrap:wrap}.result-actions .btn{min-height:36px;padding:6px 10px;font-size:.8rem}.empty{padding:18px;border:1px dashed #c7d3df;border-radius:10px;background:#fff;color:var(--muted)}
.library-title{margin:30px 0 8px;color:var(--ink);font-size:1.25rem}.library-note{margin:0 0 14px;color:var(--muted);font-size:.84rem}.group{margin-top:22px}.group-title{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:var(--ink);font-size:1.18rem}.group-title:before{content:"";width:5px;height:1.3em;border-radius:4px;background:#56b6db}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow);min-width:0}.code{margin:0;color:var(--muted);font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace}.card h2{margin:3px 0 7px;color:var(--ink);font-size:1.05rem}.assessment{margin:0 0 12px;color:#526579;font-size:.86rem}.card .actions{margin-top:auto}footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:720px){main{width:min(100% - 18px,1120px);padding-top:14px}.hero{padding:13px;border-radius:13px}.hero-row{align-items:flex-start}.hero-brand{gap:10px;align-items:flex-start}.hero-logo{width:86px;margin-top:3px}.hero h1{font-size:1.55rem}.grid{grid-template-columns:1fr}.btn{flex:1}.hero .actions{width:100%}.search-row{grid-template-columns:1fr}.search-panel .btn{width:100%}.results-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main>
<section class="hero"><div class="hero-row"><div class="hero-brand"><img class="hero-logo" src="assets/jcsa-brush-logo.png" alt="JCSA"><div class="hero-copy"><p class="eyebrow">REPORT LIBRARY</p><h1>カテゴリ別インテリジェンス・レポート</h1><p id="updated" class="lead">最新情報を読み込んでいます…</p></div></div><div class="actions"><a class="btn primary" href="index.html">日本向け評価へ戻る</a><a class="btn" href="downloads.html">過去レポート・ダウンロード</a></div></div></section>

<section class="search-panel" aria-label="記事横断検索">
  <h2 class="search-title">記事横断検索</h2>
  <div class="search-row">
    <input id="articleSearch" class="search-input" type="search" inputmode="search" autocomplete="off" placeholder="記事を検索（例：GPS 妨害、中国 衛星、ランサムウェア）" aria-label="カテゴリ配下の記事を検索">
    <select id="categoryFilter" class="search-select" aria-label="カテゴリで絞り込み"><option value="">すべてのカテゴリ</option></select>
    <button id="clearSearch" class="btn" type="button">クリア</button>
  </div>
  <p id="searchStatus" class="search-help">最新記事を準備しています。検索を開始すると、過去レポートも順次検索対象に追加します。</p>
</section>

<section id="searchResultsWrap" class="results-wrap" aria-live="polite">
  <div class="results-head"><h2>検索結果</h2><span id="resultCount" class="search-help"></span></div>
  <div id="searchResults" class="result-list"></div>
</section>

<h2 class="library-title">最新カテゴリ別レポート</h2>
<p class="library-note">下記は最新日のカテゴリ別レポートです。上の検索窓は、このカードではなく各レポート内の記事と過去記事を検索します。</p>
<div id="groups"><p class="empty">読み込み中…</p></div>
<footer>検索結果には日付、カテゴリ、記事タイトル、要約を表示します。</footer>
</main>
<script>
"use strict";
const BASE="https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const MANIFEST=`${BASE}/latest/index.json`,ASSESSMENT=`${BASE}/latest/assessment/index.json`,HISTORY=`${BASE}/latest/history.json`;
const GROUPS=[
  {name:"各国",types:["cyber_iran","cyber_china","cyber_russia","cyber_north_korea"]},
  {name:"テック",types:["space","cyber_tech"]},
  {name:"軍事・防衛",types:["cyber_military"]}
];
const $=id=>document.getElementById(id);
const articleSearch=$("articleSearch"),categoryFilter=$("categoryFilter"),clearSearch=$("clearSearch"),searchStatus=$("searchStatus"),searchResultsWrap=$("searchResultsWrap"),searchResults=$("searchResults"),resultCount=$("resultCount");
let latestManifest=null,reportSources=[],searchIndex=[],indexedSourceKeys=new Set(),indexingPromise=null,indexingComplete=false,indexedReports=0;

function safeUrl(v){try{const u=new URL(String(v||""));return ["http:","https:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function fmtDate(v){const s=String(v||"");return /^\d{8}$/.test(s)?`${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`:s||"不明"}
function reportDisplayName(r){const rt=String(r.report_type||"");if(rt==="cyber_tech")return "サイバー・テック";return String(r.display_name||rt||"レポート")}
function reportPageUrl(r,date){const p=new URLSearchParams();p.set("type",String(r.report_type||""));p.set("name",reportDisplayName(r));p.set("date",String(date||""));const md=safeUrl(r.latest_markdown_url||r.markdown_url),pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(md)p.set("md",md);if(pdf)p.set("pdf",pdf);return `report.html?${p.toString()}`}
function makeBtn(label,href,primary=false){const a=document.createElement("a");a.className=`btn${primary?" primary":""}`;a.textContent=label;a.href=href;if(/^https?:/.test(href)){a.target="_blank";a.rel="noopener noreferrer"}return a}
function normalizeSearch(v){return String(v||"").normalize("NFKC").toLowerCase().replace(/\s+/g," ").trim()}
function cleanText(v){return String(v||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/`(.+?)`/g,"$1").replace(/\s+/g," ").trim()}
function sourceFromUrl(v){try{return new URL(String(v||"")).hostname.toLowerCase().replace(/^www\./,"")}catch(_){return ""}}
function hashText(v){let h=2166136261;for(const c of String(v||"")){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function normalizedUrl(v){try{const u=new URL(String(v||""));if(!["http:","https:"].includes(u.protocol))return "";u.hash="";["utm_source","utm_medium","utm_campaign","utm_term","utm_content","ref","source"].forEach(k=>u.searchParams.delete(k));let path=u.pathname.replace(/\/+$/ ,"")||"/";return `${u.protocol}//${u.hostname.toLowerCase()}${path}${u.search}`}catch(_){return ""}}
function anchorFor(url,title){return `article-${hashText(normalizedUrl(url)||cleanText(title))}`}
function truncate(v,n=260){const s=cleanText(v);return s.length>n?`${s.slice(0,n)}…`:s}

function parseMarkdown(text){
  text=String(text||"").replace(/^\uFEFF/,"");const lines=text.split(/\r?\n/),articles=[];let section="ニュース",i=0;
  while(i<lines.length){const line=lines[i].trim();if(line.startsWith("## ")&&!line.startsWith("### ")){section=cleanText(line.slice(3))||"ニュース";i++;continue}if(!line.startsWith("### ")){i++;continue}const title=cleanText(line.slice(4));i++;const block=[];while(i<lines.length){const x=lines[i].trim();if(x.startsWith("### ")||(x.startsWith("## ")&&!x.startsWith("### ")))break;block.push(lines[i++])}let score="",source="",url="",mode="summary";const summary=[],importance=[],points=[];for(const raw of block){let s=raw.trim();if(!s||s==="---")continue;const meta=s.match(/^スコア[：:]\s*([0-9.]+)\s*[／/]\s*出典[：:]\s*(.+?)\s*$/);if(meta){score=cleanText(meta[1]);source=cleanText(meta[2]);continue}const link=s.match(/\[元記事\]\((https?:\/\/[^)]+)\)/);if(link){url=link[1].trim();continue}if(s==="**重要性**"||s==="重要性"){mode="importance";continue}if(s==="**重要ポイント**"||s==="重要ポイント"){mode="points";continue}if(mode==="points"){s=cleanText(s.replace(/^[-*]\s+/,""));if(s)points.push(s)}else if(mode==="importance"){s=cleanText(s);if(s)importance.push(s)}else{s=cleanText(s);if(s)summary.push(s)}}if(title)articles.push({section,title,score,source,url,summary:cleanText(summary.join(" ")),importance:cleanText(importance.join(" ")),points})}
  return articles;
}

function renderCategories(manifest,assessment){
  const reports=Array.isArray(manifest?.reports)?manifest.reports:[],cats=assessment?.categories||{};$("updated").textContent=`更新対象日: ${fmtDate(manifest?.report_date)}`;const root=$("groups");root.replaceChildren();const used=new Set();
  for(const g of GROUPS){const matches=reports.filter(r=>g.types.includes(String(r.report_type||"")));matches.forEach(r=>used.add(String(r.report_type||"")));const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent=g.name;section.appendChild(h);if(!matches.length){const e=document.createElement("p");e.className="empty";e.textContent="現在公開中のレポートはありません。";section.appendChild(e)}else{const grid=document.createElement("div");grid.className="grid";for(const r of matches){const rt=String(r.report_type||""),cat=cats[rt]||{};const card=document.createElement("article");card.className="card";const code=document.createElement("p");code.className="code";code.textContent=rt;const title=document.createElement("h2");title.textContent=reportDisplayName(r);const p=document.createElement("p");p.className="assessment";p.textContent=cat.assessment?`Lv.${cat.assessment_level||"-"}/5　${cat.assessment}`:"最新の分析レポートを公開しています。";const actions=document.createElement("div");actions.className="actions";actions.appendChild(makeBtn("ウェブで読む",reportPageUrl(r,manifest.report_date),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(pdf)actions.appendChild(makeBtn("PDF取得",pdf));card.append(code,title,p,actions);grid.appendChild(card)}section.appendChild(grid)}root.appendChild(section)}
  const other=reports.filter(r=>!used.has(String(r.report_type||"")));if(other.length){const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent="その他";const grid=document.createElement("div");grid.className="grid";for(const r of other){const card=document.createElement("article");card.className="card";const title=document.createElement("h2");title.textContent=reportDisplayName(r);const actions=document.createElement("div");actions.className="actions";actions.appendChild(makeBtn("ウェブで読む",reportPageUrl(r,manifest.report_date),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(pdf)actions.appendChild(makeBtn("PDF取得",pdf));card.append(title,actions);grid.appendChild(card)}section.append(h,grid);root.appendChild(section)}
}

function collectSources(manifest,history){
  const out=[],seen=new Set();
  const add=(date,r,isLatest=false)=>{const rt=String(r?.report_type||"");const md=safeUrl(r?.latest_markdown_url||r?.markdown_url);if(!date||!rt||!md)return;const key=`${date}|${rt}`;if(seen.has(key))return;seen.add(key);out.push({key,date:String(date),reportType:rt,displayName:reportDisplayName(r),md,pdf:safeUrl(r?.latest_pdf_url||r?.pdf_url),report:r,isLatest})};
  for(const r of (manifest?.reports||[]))add(manifest.report_date,r,true);
  for(const d of (history?.dates||[]))for(const r of (d?.reports||[]))add(d.report_date,r,false);
  out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return out;
}
function populateCategoryFilter(){const values=[...new Map(reportSources.map(s=>[s.reportType,s.displayName])).entries()].sort((a,b)=>a[1].localeCompare(b[1],"ja"));for(const [rt,name] of values){const o=document.createElement("option");o.value=rt;o.textContent=name;categoryFilter.appendChild(o)}}

async function fetchAndIndex(source){
  if(indexedSourceKeys.has(source.key))return;indexedSourceKeys.add(source.key);
  try{const u=new URL(source.md);if(source.isLatest)u.searchParams.set("_",Date.now());const r=await fetch(u,{cache:source.isLatest?"no-store":"force-cache",headers:{Accept:"text/markdown,text/plain;q=.9,*/*;q=.1"}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const articles=parseMarkdown(await r.text());for(const a of articles){const reportUrl=reportPageUrl(source.report,source.date);searchIndex.push({date:source.date,reportType:source.reportType,displayName:source.displayName,section:a.section,title:a.title,summary:a.summary,importance:a.importance,points:a.points||[],score:a.score,source:a.source||sourceFromUrl(a.url),url:a.url,reportUrl,anchor:anchorFor(a.url,a.title),search:normalizeSearch([source.displayName,source.reportType,a.section,a.title,a.summary,a.importance,(a.points||[]).join(" "),a.source,sourceFromUrl(a.url),a.score].join(" "))})}}catch(e){console.warn("index failed",source.key,e)}finally{indexedReports++}}

async function indexLatest(){const latest=reportSources.filter(s=>s.isLatest);for(const s of latest)await fetchAndIndex(s);updateSearchStatus();if(articleSearch.value.trim())renderSearchResults()}
async function ensureFullIndex(){
  if(indexingPromise)return indexingPromise;
  indexingPromise=(async()=>{const pending=reportSources.filter(s=>!indexedSourceKeys.has(s.key));let cursor=0;const worker=async()=>{while(cursor<pending.length){const s=pending[cursor++];await fetchAndIndex(s);if(indexedReports%4===0){updateSearchStatus();if(articleSearch.value.trim())renderSearchResults()}}};await Promise.all(Array.from({length:Math.min(4,pending.length||1)},worker));indexingComplete=true;updateSearchStatus();if(articleSearch.value.trim())renderSearchResults()})();
  return indexingPromise;
}

function updateSearchStatus(matchCount=null){
  const q=articleSearch.value.trim();if(!q){searchStatus.textContent=indexingComplete?`過去分を含む ${searchIndex.length}件の記事を検索できます。`:`最新 ${searchIndex.length}件を準備済み。検索開始時に過去分も索引化します。`;return}
  const progress=`${Math.min(indexedReports,reportSources.length)}/${reportSources.length}レポート`;
  searchStatus.innerHTML=indexingComplete?`過去分を含めて検索済み。<span class="search-count">${matchCount??0}件</span>一致しました。`:`検索中… <span class="search-count">${matchCount??0}件</span>一致 / 索引 ${progress}`;
}
function renderSearchResults(){
  const q=normalizeSearch(articleSearch.value),tokens=q?q.split(" ").filter(Boolean):[],category=categoryFilter.value;if(!tokens.length){searchResultsWrap.style.display="none";searchResults.replaceChildren();resultCount.textContent="";updateSearchStatus();return}
  const matches=searchIndex.filter(x=>(!category||x.reportType===category)&&tokens.every(t=>x.search.includes(t))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.score||0)-Number(a.score||0));
  searchResultsWrap.style.display="block";searchResults.replaceChildren();resultCount.textContent=`${matches.length}件${matches.length>100?"（上位100件を表示）":""}`;
  if(!matches.length){const p=document.createElement("p");p.className="empty";p.textContent=indexingComplete?"一致する記事はありません。":"現在索引済みの範囲では一致がありません。過去分を引き続き検索しています。";searchResults.appendChild(p);updateSearchStatus(0);return}
  for(const item of matches.slice(0,100)){const card=document.createElement("article");card.className="result-card";const meta=document.createElement("div");meta.className="result-meta";const date=document.createElement("span");date.className="result-date";date.textContent=fmtDate(item.date);const cat=document.createElement("span");cat.textContent=item.displayName;meta.append(date,cat);if(item.source){const src=document.createElement("span");src.textContent=item.source;meta.appendChild(src)}if(item.score){const score=document.createElement("span");score.textContent=`SCORE ${item.score}`;meta.appendChild(score)}const h=document.createElement("h3");h.textContent=item.title;const p=document.createElement("p");p.className="result-summary";p.textContent=truncate(item.summary||item.importance||item.points.join(" ")||"要約なし");const actions=document.createElement("div");actions.className="result-actions";actions.appendChild(makeBtn("該当日のレポートを開く",`${item.reportUrl}#${item.anchor}`,true));const original=safeUrl(item.url);if(original)actions.appendChild(makeBtn("元記事",original));card.append(meta,h,p,actions);searchResults.appendChild(card)}
  updateSearchStatus(matches.length);
}

articleSearch.addEventListener("focus",()=>{if(reportSources.length)ensureFullIndex()});
articleSearch.addEventListener("input",()=>{if(articleSearch.value.trim())ensureFullIndex();renderSearchResults()});
categoryFilter.addEventListener("change",renderSearchResults);
clearSearch.addEventListener("click",()=>{articleSearch.value="";categoryFilter.value="";renderSearchResults();articleSearch.focus()});

(async()=>{try{const [mRes,aRes,hRes]=await Promise.all([fetch(`${MANIFEST}?_=${Date.now()}`,{cache:"no-store"}),fetch(`${ASSESSMENT}?_=${Date.now()}`,{cache:"no-store"}),fetch(`${HISTORY}?_=${Date.now()}`,{cache:"no-store"})]);if(!mRes.ok)throw new Error(`manifest HTTP ${mRes.status}`);const manifest=await mRes.json(),assessment=aRes.ok?await aRes.json():{},history=hRes.ok?await hRes.json():{dates:[]};latestManifest=manifest;renderCategories(manifest,assessment);reportSources=collectSources(manifest,history);populateCategoryFilter();await indexLatest()}catch(e){console.error(e);$("groups").innerHTML='<p class="empty">最新レポートの取得に失敗しました。時間を置いて再読み込みしてください。</p>';$("updated").textContent="取得失敗";searchStatus.textContent="レポートを取得できないため検索できません。"}})();
</script></body></html>
