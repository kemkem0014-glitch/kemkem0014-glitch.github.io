<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>カテゴリ別インテリジェンス・レポート</title>
<style>
:root{--bg:#f3f6f9;--surface:#fff;--ink:#10284e;--body:#314763;--muted:#6c7b8d;--line:#d9e3ec;--blue:#2378b9;--shadow:0 8px 24px rgba(26,52,78,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.6}a{color:inherit}
main{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 56px}.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px}.hero-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.eyebrow{margin:0 0 5px;color:#2378b9;font-size:.78rem;font-weight:900;letter-spacing:.12em}h1{margin:0;color:var(--ink);font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.2}.lead{margin:9px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:#173657;text-decoration:none;font-size:.88rem;font-weight:800}.btn.primary{background:#1677b8;border-color:#1677b8;color:#fff}.group{margin-top:22px}.group-title{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:var(--ink);font-size:1.18rem}.group-title:before{content:"";width:5px;height:1.3em;border-radius:4px;background:#56b6db}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow);min-width:0}.code{margin:0;color:var(--muted);font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace}.card h2{margin:3px 0 7px;color:var(--ink);font-size:1.05rem}.assessment{margin:0 0 12px;color:#526579;font-size:.86rem}.card .actions{margin-top:auto}.empty{padding:18px;border:1px dashed #c7d3df;border-radius:10px;background:#fff;color:var(--muted)}footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:720px){main{width:min(100% - 18px,1120px);padding-top:14px}.hero{padding:18px}.grid{grid-template-columns:1fr}.btn{flex:1}.hero .actions{width:100%}}
</style>
</head>
<body><main>
<section class="hero"><div class="hero-row"><div><p class="eyebrow">REPORT LIBRARY</p><h1>カテゴリ別インテリジェンス・レポート</h1><p id="updated" class="lead">最新情報を読み込んでいます…</p></div><div class="actions"><a class="btn primary" href="index.html">日本向け評価へ戻る</a><a class="btn" href="downloads.html">過去レポート・ダウンロード</a></div></div></section>
<div id="groups"><p class="empty">読み込み中…</p></div>
<footer>各カテゴリの詳細はWeb版またはPDFから確認できます。</footer>
</main>
<script>
"use strict";
const BASE="https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const MANIFEST=`${BASE}/latest/index.json`,ASSESSMENT=`${BASE}/latest/assessment/index.json`;
const GROUPS=[
  {name:"各国",types:["cyber_iran","cyber_china","cyber_russia","cyber_north_korea"]},
  {name:"宇宙",types:["space"]},
  {name:"テック",types:["cyber_tech"]},
  {name:"軍事・防衛",types:["cyber_military"]}
];
const $=id=>document.getElementById(id);
function safeUrl(v){try{const u=new URL(String(v||""));return ["http:","https:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function fmtDate(v){const s=String(v||"");return /^\d{8}$/.test(s)?`${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`:s}
function reportPageUrl(r,date){const p=new URLSearchParams();p.set("type",String(r.report_type||""));p.set("name",String(r.display_name||r.report_type||"レポート"));p.set("date",String(date||""));const md=safeUrl(r.latest_markdown_url||r.markdown_url),pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(md)p.set("md",md);if(pdf)p.set("pdf",pdf);return `report.html?${p.toString()}`}
function makeBtn(label,href,primary=false){const a=document.createElement("a");a.className=`btn${primary?" primary":""}`;a.textContent=label;a.href=href;if(/^https?:/.test(href)){a.target="_blank";a.rel="noopener noreferrer"}return a}
function render(manifest,assessment){const reports=Array.isArray(manifest?.reports)?manifest.reports:[],cats=assessment?.categories||{};$("updated").textContent=`更新対象日: ${fmtDate(manifest?.report_date)||"不明"}`;const root=$("groups");root.replaceChildren();const used=new Set();for(const g of GROUPS){const matches=reports.filter(r=>g.types.includes(String(r.report_type||"")));matches.forEach(r=>used.add(String(r.report_type||"")));const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent=g.name;section.appendChild(h);if(!matches.length){const e=document.createElement("p");e.className="empty";e.textContent="現在公開中のレポートはありません。";section.appendChild(e)}else{const grid=document.createElement("div");grid.className="grid";for(const r of matches){const rt=String(r.report_type||""),cat=cats[rt]||{};const card=document.createElement("article");card.className="card";const code=document.createElement("p");code.className="code";code.textContent=rt;const title=document.createElement("h2");title.textContent=String(r.display_name||rt);const p=document.createElement("p");p.className="assessment";p.textContent=cat.assessment?`Lv.${cat.assessment_level||"-"}/5　${cat.assessment}`:"最新の分析レポートを公開しています。";const actions=document.createElement("div");actions.className="actions";actions.appendChild(makeBtn("ウェブで読む",reportPageUrl(r,manifest.report_date),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(pdf)actions.appendChild(makeBtn("PDF取得",pdf));card.append(code,title,p,actions);grid.appendChild(card)}section.appendChild(grid)}root.appendChild(section)}
const other=reports.filter(r=>!used.has(String(r.report_type||"")));if(other.length){const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent="その他";const grid=document.createElement("div");grid.className="grid";for(const r of other){const card=document.createElement("article");card.className="card";const title=document.createElement("h2");title.textContent=String(r.display_name||r.report_type||"レポート");const actions=document.createElement("div");actions.className="actions";actions.appendChild(makeBtn("ウェブで読む",reportPageUrl(r,manifest.report_date),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(pdf)actions.appendChild(makeBtn("PDF取得",pdf));card.append(title,actions);grid.appendChild(card)}section.append(h,grid);root.appendChild(section)}}
(async()=>{try{const [m,a]=await Promise.all([fetch(`${MANIFEST}?_=${Date.now()}`,{cache:"no-store"}),fetch(`${ASSESSMENT}?_=${Date.now()}`,{cache:"no-store"})]);if(!m.ok)throw new Error(`manifest HTTP ${m.status}`);render(await m.json(),a.ok?await a.json():{})}catch(e){console.error(e);$("groups").innerHTML='<p class="empty">最新レポートの取得に失敗しました。時間を置いて再読み込みしてください。</p>';$("updated").textContent="取得失敗"}})();
</script></body></html>
