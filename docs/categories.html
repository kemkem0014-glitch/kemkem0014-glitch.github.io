<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>カテゴリ別インテリジェンス・レポート</title>
<style>
:root{--bg:#f3f6f9;--surface:#fff;--ink:#10284e;--body:#314763;--muted:#6c7b8d;--line:#d9e3ec;--blue:#2378b9;--shadow:0 8px 24px rgba(26,52,78,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.6}a{color:inherit}
main{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 56px}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 18% 35%,rgba(37,167,228,.22),transparent 32%),linear-gradient(135deg,#061529 0%,#082542 58%,#0b3856 100%);border:0;border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(3,28,48,.2);margin-bottom:22px;color:#fff}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(56,184,238,.06) 48%,transparent 100%);pointer-events:none}.hero-row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.hero-brand{display:flex;align-items:center;gap:18px;min-width:0}.hero-logo{width:clamp(110px,12vw,180px);height:auto;flex:0 0 auto;object-fit:contain}.hero-copy{min-width:0}.eyebrow{margin:0 0 5px;color:#63d0ff;font-size:.76rem;font-weight:900;letter-spacing:.14em}h1{margin:0;color:#fff;font-size:clamp(2rem,4vw,3.25rem);line-height:1.04;letter-spacing:-.035em}.lead{margin:9px 0 0;color:#c9dbe8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:#173657;text-decoration:none;font:inherit;font-size:.88rem;font-weight:800;cursor:pointer}.btn.primary{background:#1677b8;border-color:#1677b8;color:#fff}.hero .btn{border-color:rgba(179,220,240,.42);background:rgba(255,255,255,.09);color:#fff}.hero .btn.primary{background:#1c8dcc;border-color:#1c8dcc;color:#fff}
.search-panel{margin-bottom:22px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}.search-row{display:flex;gap:9px;align-items:center}.search-input{width:100%;min-height:46px;padding:10px 13px;border:1px solid #bfcddd;border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:.95rem;outline:none}.search-input:focus{border-color:#2378b9;box-shadow:0 0 0 3px rgba(35,120,185,.12)}.search-help{margin:8px 0 0;color:var(--muted);font-size:.8rem}.search-count{font-weight:800;color:var(--ink)}
.group{margin-top:22px}.group-title{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:var(--ink);font-size:1.18rem}.group-title:before{content:"";width:5px;height:1.3em;border-radius:4px;background:#56b6db}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;box-shadow:var(--shadow);min-width:0}.code{margin:0;color:var(--muted);font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace}.card h2{margin:3px 0 7px;color:var(--ink);font-size:1.05rem}.assessment{margin:0 0 12px;color:#526579;font-size:.86rem}.card .actions{margin-top:auto}.empty{padding:18px;border:1px dashed #c7d3df;border-radius:10px;background:#fff;color:var(--muted)}.search-empty{display:none;margin-top:18px}footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:720px){main{width:min(100% - 18px,1120px);padding-top:14px}.hero{padding:13px;border-radius:13px}.hero-row{align-items:flex-start}.hero-brand{gap:10px;align-items:flex-start}.hero-logo{width:86px;margin-top:3px}.hero h1{font-size:1.55rem}.grid{grid-template-columns:1fr}.btn{flex:1}.hero .actions{width:100%}.search-row{align-items:stretch;flex-direction:column}.search-panel .btn{width:100%}}
</style>
</head>
<body><main>
<section class="hero"><div class="hero-row"><div class="hero-brand"><img class="hero-logo" src="assets/jcsa-brush-logo.png" alt="JCSA"><div class="hero-copy"><p class="eyebrow">REPORT LIBRARY</p><h1>カテゴリ別インテリジェンス・レポート</h1><p id="updated" class="lead">最新情報を読み込んでいます…</p></div></div><div class="actions"><a class="btn primary" href="index.html">日本向け評価へ戻る</a><a class="btn" href="downloads.html">過去レポート・ダウンロード</a></div></div></section>
<section class="search-panel" aria-label="カテゴリ別レポート検索"><div class="search-row"><input id="reportSearch" class="search-input" type="search" inputmode="search" autocomplete="off" placeholder="カテゴリ名・国名・評価文を検索（例：イラン、宇宙、サイバー）" aria-label="カテゴリ別レポートを検索"><button id="clearSearch" class="btn" type="button">クリア</button></div><p id="searchStatus" class="search-help">カテゴリ名、レポート名、評価文から検索できます。</p></section>
<div id="groups"><p class="empty">読み込み中…</p></div>
<p id="searchEmpty" class="empty search-empty">一致するカテゴリ別レポートはありません。</p>
<footer>各カテゴリの詳細はWeb版またはPDFから確認できます。</footer>
</main>
<script>
"use strict";
const BASE="https://hmnbalygfomelhjuscjm.supabase.co/storage/v1/object/public/public-news-reports";
const MANIFEST=`${BASE}/latest/index.json`,ASSESSMENT=`${BASE}/latest/assessment/index.json`;
const GROUPS=[
  {name:"各国",types:["cyber_iran","cyber_china","cyber_russia","cyber_north_korea"]},
  {name:"テック",types:["space","cyber_tech"]},
  {name:"軍事・防衛",types:["cyber_military"]}
];
const $=id=>document.getElementById(id);
const reportSearch=$("reportSearch"),clearSearch=$("clearSearch"),searchStatus=$("searchStatus"),searchEmpty=$("searchEmpty");
function safeUrl(v){try{const u=new URL(String(v||""));return ["http:","https:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function fmtDate(v){const s=String(v||"");return /^\d{8}$/.test(s)?`${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`:s}
function reportDisplayName(r){const rt=String(r.report_type||"");if(rt==="cyber_tech")return "サイバー・テック";return String(r.display_name||rt||"レポート")}
function reportPageUrl(r,date){const p=new URLSearchParams();p.set("type",String(r.report_type||""));p.set("name",reportDisplayName(r));p.set("date",String(date||""));const md=safeUrl(r.latest_markdown_url||r.markdown_url),pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(md)p.set("md",md);if(pdf)p.set("pdf",pdf);return `report.html?${p.toString()}`}
function makeBtn(label,href,primary=false){const a=document.createElement("a");a.className=`btn${primary?" primary":""}`;a.textContent=label;a.href=href;if(/^https?:/.test(href)){a.target="_blank";a.rel="noopener noreferrer"}return a}
function normalizeSearch(v){return String(v||"").normalize("NFKC").toLowerCase().replace(/\s+/g," ").trim()}
function applySearch(){const q=normalizeSearch(reportSearch.value),tokens=q?q.split(" ").filter(Boolean):[];let visible=0,total=0;document.querySelectorAll("#groups .group").forEach(section=>{let groupVisible=0;section.querySelectorAll(".card[data-search]").forEach(card=>{total++;const hay=card.dataset.search||"";const match=!tokens.length||tokens.every(t=>hay.includes(t));card.hidden=!match;if(match){visible++;groupVisible++}});section.hidden=groupVisible===0});searchEmpty.style.display=visible===0&&total>0?"block":"none";searchStatus.innerHTML=q?`検索結果: <span class="search-count">${visible}件</span> / ${total}件`:`<span class="search-count">${total}件</span>のカテゴリ別レポートを表示中`}
reportSearch.addEventListener("input",applySearch);clearSearch.addEventListener("click",()=>{reportSearch.value="";applySearch();reportSearch.focus()});
function render(manifest,assessment){const reports=Array.isArray(manifest?.reports)?manifest.reports:[],cats=assessment?.categories||{};$("updated").textContent=`更新対象日: ${fmtDate(manifest?.report_date)||"不明"}`;const root=$("groups");root.replaceChildren();const used=new Set();for(const g of GROUPS){const matches=reports.filter(r=>g.types.includes(String(r.report_type||"")));matches.forEach(r=>used.add(String(r.report_type||"")));const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent=g.name;section.appendChild(h);if(!matches.length){const e=document.createElement("p");e.className="empty";e.textContent="現在公開中のレポートはありません。";section.appendChild(e)}else{const grid=document.createElement("div");grid.className="grid";for(const r of matches){const rt=String(r.report_type||""),cat=cats[rt]||{},displayName=reportDisplayName(r);const card=document.createElement("article");card.className="card";card.dataset.search=normalizeSearch([g.name,rt,displayName,cat.assessment,cat.assessment_level,cat.confidence].join(" "));const code=document.createElement("p");code.className="code";code.textContent=rt;const title=document.createElement("h2");title.textContent=displayName;const p=document.createElement("p");p.className="assessment";p.textContent=cat.assessment?`Lv.${cat.assessment_level||"-"}/5　${cat.assessment}`:"最新の分析レポートを公開しています。";const actions=document.createElement("div");actions.className="actions";actions.appendChild(makeBtn("ウェブで読む",reportPageUrl(r,manifest.report_date),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(pdf)actions.appendChild(makeBtn("PDF取得",pdf));card.append(code,title,p,actions);grid.appendChild(card)}section.appendChild(grid)}root.appendChild(section)}
const other=reports.filter(r=>!used.has(String(r.report_type||"")));if(other.length){const section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.className="group-title";h.textContent="その他";const grid=document.createElement("div");grid.className="grid";for(const r of other){const displayName=reportDisplayName(r),rt=String(r.report_type||"");const card=document.createElement("article");card.className="card";card.dataset.search=normalizeSearch(["その他",rt,displayName].join(" "));const title=document.createElement("h2");title.textContent=displayName;const actions=document.createElement("div");actions.className="actions";actions.appendChild(makeBtn("ウェブで読む",reportPageUrl(r,manifest.report_date),true));const pdf=safeUrl(r.latest_pdf_url||r.pdf_url);if(pdf)actions.appendChild(makeBtn("PDF取得",pdf));card.append(title,actions);grid.appendChild(card)}section.append(h,grid);root.appendChild(section)}applySearch()}
(async()=>{try{const [m,a]=await Promise.all([fetch(`${MANIFEST}?_=${Date.now()}`,{cache:"no-store"}),fetch(`${ASSESSMENT}?_=${Date.now()}`,{cache:"no-store"})]);if(!m.ok)throw new Error(`manifest HTTP ${m.status}`);render(await m.json(),a.ok?await a.json():{})}catch(e){console.error(e);$("groups").innerHTML='<p class="empty">最新レポートの取得に失敗しました。時間を置いて再読み込みしてください。</p>';$("updated").textContent="取得失敗";searchStatus.textContent="レポートを取得できないため検索できません。"}})();
</script></body></html>
