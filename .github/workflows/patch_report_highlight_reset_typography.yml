name: Patch Report Highlight Reset and Typography

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch_report_highlight_reset_typography.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch report
        run: python tools/patch_report_highlight_typography.py
      - name: Verify
        run: |
          grep -q 'card.is-referenced' docs/report.html
          grep -q 'classList.remove("is-referenced")' docs/report.html
          grep -q 'font-size:1.05rem' docs/report.html
          ! grep -q 'card:target' docs/report.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix report highlight reset and unify analysis heading sizes"
          git push
