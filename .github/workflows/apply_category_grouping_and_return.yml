name: Apply Category Grouping and Return Button

on:
  push:
    branches: [main]
    paths:
      - tools/patch_category_grouping_and_return.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply category grouping and return button
        run: python tools/patch_category_grouping_and_return.py
      - name: Verify
        run: |
          set -e
          grep -q '{name:"テック",types:\["space","cyber_tech"\]}' docs/categories.html
          ! grep -q '{name:"宇宙",types:\["space"\]}' docs/categories.html
          grep -q 'return "サイバー・テック"' docs/categories.html
          grep -q 'category-return' docs/report.html
          grep -q 'カテゴリ別へ戻る' docs/report.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/categories.html docs/report.html
          git diff --cached --quiet && exit 0
          git commit -m "Group space and cyber tech and add category return navigation"
          git push
