name: Remove Hero Image And Bridge Once

on:
  push:
    paths:
      - '.github/workflows/_remove_hero_image_bridge_once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero image and assessment bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              '.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:center;',
              '.hero{position:relative;overflow:hidden;display:block;'
          )
          text = re.sub(r'\.hero-logo\{[^}]*\}', '', text)
          text = text.replace('.hero{grid-template-columns:150px 1fr}', '')
          text = text.replace('.hero{grid-template-columns:100px 1fr;gap:13px;padding:13px;border-radius:13px}', '.hero{padding:13px;border-radius:13px}')
          text = text.replace('  <img class="hero-logo" src="assets/img/japan-cyber-situation-awareness.jpg" alt="Japan Cyber Situation Awareness emblem">\n', '')
          text = re.sub(r'\.assessment-bridge\{[^}]*\}', '', text)
          text = re.sub(r'\.assessment-bridge b\{[^}]*\}', '', text)
          text = text.replace('  <div id="assessmentBridge" class="assessment-bridge"></div>\n', '')

          bridge_js = 'const overall=report?.japan_impact_overall||{};const bridge=$("assessmentBridge");bridge.replaceChildren();const strong=document.createElement("b");strong.textContent="これを受けた評価: ";bridge.appendChild(strong);bridge.appendChild(document.createTextNode(val(overall.assessment,"総合評価はまだありません。")));'
          text = text.replace(bridge_js, '')

          if 'hero-logo' in text or 'assessmentBridge' in text or 'これを受けた評価' in text:
              raise SystemExit('cleanup incomplete')

          p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Remove low-resolution emblem and assessment bridge"
          git push
