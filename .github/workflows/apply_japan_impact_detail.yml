name: Apply Japan Impact Detail

on:
  push:
    branches: [main]
    paths:
      - tools/patch_japan_impact_detail.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply Japan impact detail layout
        run: python tools/patch_japan_impact_detail.py
      - name: Verify
        run: |
          set -e
          grep -q 'impact-pathway' docs/index.html
          grep -q 'impact-rationale' docs/index.html
          grep -q 'その他の影響評価' docs/index.html
          grep -q 'item.impact_domain' docs/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show detailed Japan impact pathways and rationale"
          git push
